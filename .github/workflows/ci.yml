name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo lint
      - run: pnpm turbo typecheck
      - run: pnpm turbo build
      - name: Run tests with coverage
        run: pnpm turbo test -- --coverage
      - name: Validate package exports (core)
        run: |
          pnpm dlx @arethetypeswrong/cli --pack packages/core
          pnpm dlx publint packages/core
      - name: Validate package exports (typeorm)
        run: |
          pnpm dlx @arethetypeswrong/cli --pack packages/typeorm
          pnpm dlx publint packages/typeorm
      - name: Verify publishability (dry-run)
        run: |
          pnpm --filter @nestjs-odata/core publish --dry-run --access public
          pnpm --filter @nestjs-odata/typeorm publish --dry-run --access public
