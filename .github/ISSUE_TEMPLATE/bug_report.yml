name: Bug Report
description: Report a bug in nestjs-odata
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug! Please fill in the details below.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of the bug
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package Version
      description: "e.g., @nestjs-odata/core@0.1.0"
    validations:
      required: true
  - type: input
    id: nestjs-version
    attributes:
      label: NestJS Version
      description: "e.g., 11.1.0"
    validations:
      required: true
  - type: dropdown
    id: node-version
    attributes:
      label: Node.js Version
      options:
        - "20.x"
        - "22.x"
        - "24.x"
    validations:
      required: true
